<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
</head>
<body>

    <div class="container">

        <h1>Task Tracker</h1>

        <form id="taskForm">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Enter a new task"
            >

            <button type="submit">
                Add Task
            </button>
        </form>

        <ul id="taskList">
            <!-- Tasks will appear here -->
        </ul>

    </div>

    <script src="script.js"></script>

</body>
</html>
